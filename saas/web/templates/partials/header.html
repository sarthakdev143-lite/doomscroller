{% from "partials/marks.html" import mark %}
<header class="site-header" data-site-header>
  <div class="wrap site-header__inner">
    <a class="wordmark" href="/" data-track="nav-home" aria-label="{{ brand_name }} home">{{ mark() }}<span>{{ brand_name }}</span></a>
    <nav class="site-nav" aria-label="Main">
      <div class="site-nav__links" id="site-menu">
        <a href="/#how" data-track="nav-how">How it works</a>
        <a href="/#clip" data-track="nav-clip">What you get</a>
        <a href="/pricing" data-track="nav-pricing">Pricing</a>
        <a href="/#api" data-track="nav-api">API</a>
        <a href="/#faq" data-track="nav-faq">FAQ</a>
        {% if not static_export %}<a href="/login" data-track="nav-sign-in">Sign in</a>{% endif %}
      </div>
      {% if launch_mode == "waitlist" %}
      <a class="btn btn--sm" href="/#join" data-track="nav-cta-waitlist">Join the waitlist</a>
      {% else %}
      <a class="btn btn--sm" href="/signup" data-track="nav-cta-signup">Start free</a>
      {% endif %}
      <button class="icon-btn menu-btn" type="button" aria-expanded="false" aria-controls="site-menu" data-menu-toggle data-track="nav-menu-toggle">
        <span class="visually-hidden">Menu</span>
        <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
      </button>
    </nav>
  </div>
</header>
