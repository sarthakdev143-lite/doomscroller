name: CI

on:
  push:
    branches: [next, master]
  pull_request:
    branches: [next, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
        exclude: ${{ (github.base_ref == 'master' || (github.event_name == 'push' && github.ref_name == 'master') || github.event_name == 'workflow_dispatch') && fromJSON('[]') || fromJSON('[{"os":"windows-latest"}]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Verify ffmpeg and ffprobe
        shell: bash
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Validate app.review_ui.PAGE inline JS (node --check)
        shell: bash
        run: |
          python -c "import pathlib, re, subprocess, tempfile; from app.review_ui import PAGE; blocks = re.findall(r'<script[^>]*>([\s\S]*?)</script>', PAGE); assert blocks, 'No inline <script> found in app.review_ui.PAGE'; d = pathlib.Path(tempfile.mkdtemp()); [((p := d / f'panel_{i}.js').write_text(b, encoding='utf-8'), subprocess.run(['node', '--check', str(p)], check=True)) for i, b in enumerate(blocks)]"

      - name: Run offline system and repo surface audit
        shell: bash
        env:
          DOOMSCROLLER_ENV_FILE: ""
          USE_MOCK: "true"
        run: python scripts/final_audit.py --offline

      - name: Run fast test suite
        shell: bash
        run: pytest -q -m "not slow"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install --no-cache-dir ruff==0.16.6

      - name: Run ruff lint
        run: ruff check --isolated --target-version py311 --select E9,F,E71,E72 --ignore F401,F841 .
