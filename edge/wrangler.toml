# Cloudflare Pages project: static site in public/ + Pages Functions in functions/ + one D1 database.
# Free tier: 100k Function requests/day, D1 5 GB / 5M rows read per day. See README.md for deploy steps.
name = "doomscroller"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

[vars]
# Public, non-secret settings. Secrets (IP_HASH_SALT, ADMIN_PASSWORD, TURNSTILE_SECRET_KEY) are set
# with `wrangler pages secret put`, never here.
PUBLIC_URL = "https://doomscroller.pages.dev"
REFERRAL_BUMP = "5"

[[d1_databases]]
binding = "DB"
database_name = "doomscroller-waitlist"
# Replace with the id printed by `npx wrangler d1 create doomscroller-waitlist` (README step 3).
# Local dev and tests ignore it.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
